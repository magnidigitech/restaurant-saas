version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/restaurant_saas?schema=public
      - ROOT_DOMAIN=${ROOT_DOMAIN:-restiq.magnidigitech.com}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://restiq.magnidigitech.com}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-change-in-coolify}
      - PORT=3000
    expose:
      - "3000"
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.restaurant-saas-app.rule=Host(`restiq.magnidigitech.com`) || HostRegexp(`{subdomain:[a-z0-9-]+}.restiq.magnidigitech.com`)"
      - "traefik.http.services.restaurant-saas-app.loadbalancer.server.port=3000"
    networks:
      - default
      - coolify
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: restaurant_saas
    ports:
      - "5432:5432"
    networks:
      - default
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  coolify:
    external: true

volumes:
  postgres_data:
