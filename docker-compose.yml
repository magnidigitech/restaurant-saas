services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/restaurant_saas?schema=public
      - DIRECT_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/restaurant_saas?schema=public
      - JWT_SECRET=${JWT_SECRET:-local_testing_secret_key_1234567890}
      - NODE_ENV=production
      - PORT=3000
    networks:
      - saas-network
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: restaurant_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Bind to loopback interface for local development access
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - saas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    build:
      context: .
      dockerfile: ./infra/pgbouncer/Dockerfile
    command:
      - /usr/bin/pgbouncer
      - /etc/pgbouncer/pgbouncer.ini
    # Bind to loopback interface for local development access
    ports:
      - "127.0.0.1:6432:6432"
    networks:
      - saas-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pidof", "pgbouncer"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  saas-network:
    driver: bridge
