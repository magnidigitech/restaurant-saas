version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/restaurant_saas?schema=public
      - ROOT_DOMAIN=${ROOT_DOMAIN:-restobird.com}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://restobird.com}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-change-in-coolify}
      - SMTP_HOST=${SMTP_HOST:-mail.restobird.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-info@restobird.com}
      - SMTP_PASS=${SMTP_PASS:-Resto@3939}
      - SMTP_FROM=${SMTP_FROM:-"Resto Bird" <info@restobird.com>}
      - SMTP_REJECT_UNAUTHORIZED=${SMTP_REJECT_UNAUTHORIZED:-false}
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: restaurant_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
